
workflows:
  customer-android:
    name: Yamak Customer (Android APK & AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
      vars:
        APP_VARIANT: "customer"
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Expo Prebuild Android
        script: npx expo prebuild --platform android --clean

      - name: Build Android APK & AAB
        script: |
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  captain-android:
    name: Yamak Captain (Android APK & AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
      vars:
        APP_VARIANT: "captain"
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Expo Prebuild Android
        script: npx expo prebuild --platform android --clean

      - name: Build Android APK & AAB
        script: |
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

  customer-ios:
    name: Yamak Customer (iOS App Store & TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Yamak Apple Integration

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        APP_VARIANT: "customer"
        BUNDLE_IDENTIFIER: "iq.yamak.app"
        XCODE_WORKSPACE: "ymktksy.xcworkspace"
        XCODE_SCHEME: "ymktksy"

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Expo Prebuild iOS
        script: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_IDENTIFIER" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  captain-ios:
    name: Yamak Captain (iOS App Store & TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Yamak

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        APP_VARIANT: "captain"
        BUNDLE_IDENTIFIER: "iq.yamak.captain"
        XCODE_WORKSPACE: "ymkkbtn.xcworkspace"
        XCODE_SCHEME: "ymkkbtn"

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Expo Prebuild iOS
        script: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_IDENTIFIER" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
